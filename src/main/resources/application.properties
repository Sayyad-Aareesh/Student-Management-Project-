# 1. DATABASE CONNECTION SETTINGS
# Replace 'student_management' with your actual database name
spring.datasource.url=jdbc:mysql://localhost:3306/student_db
# 2. DATABASE CREDENTIALS
# Default username is usually root
spring.datasource.username=root

# CHANGE THIS to your actual MySQL password. 
# If you use XAMPP and have no password, leave it blank like: spring.datasource.password=
spring.datasource.password=root

# 3. HIBERNATE & JPA SETTINGS
# 'update' automatically creates/updates your tables based on your Java @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Shows the SQL queries in your Eclipse console (helpful for debugging)
spring.jpa.show-sql=true

# Formats the SQL in the console to make it readable
spring.jpa.properties.hibernate.format_sql=true

# 4. DRIVER SETTING
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 5. SERVER PORT (Optional - default is 8080)
server.port=8087
